[package]
name = "rs-jxl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
decoder-avx512 = ["rs-jxl/decoder-avx512"]
decoder-profile = ["rs-jxl/decoder-profile"]

[[bin]]
name = "rs-jxl"
path = "src/main.rs"

[dependencies]
rs-jxl = { path = "../rs-jxl" }
clap = { workspace = true, features = ["derive"] }
png.workspace = true
zune-jpeg.workspace = true
exr.workspace = true
serde_json.workspace = true

[lints]
workspace = true
