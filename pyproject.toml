[build-system]
requires = ["setuptools>=68", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-jxl"
version = "0.1.0"
description = "CFFI bindings for the Rust rs-jxl codec"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cffi>=1.15", "numpy>=1.22"]
# Tensor support uses an existing torch installation. Install torch manually
# for the desired CPU/CUDA platform; it is deliberately not an extra dependency.

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = false
# Retain third-party notices without selecting a license for new project code.
license-files = [
    "vendor/jxl-rs/LICENSE",
    "vendor/jxl-rs/PATENTS",
    "vendor/jxl-rs/AUTHORS",
    "vendor/jxl-rs/*/LICENSE",
    "vendor/libsais-rs/LICENSE",
    "docs/PORTING_KERNELS.md",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["rs_jxl", "rs_jxl.*"]
namespaces = false

[tool.setuptools.package-data]
rs_jxl = ["*.pyi", "py.typed", "*.h"]
